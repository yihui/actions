name: Test actions

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: ./setup-r-dependencies
        with:
          working-directory: tests/pkg

      - uses: ./check-r-package
        with:
          working-directory: tests/pkg
          revision: ${{ github.sha }}

      - name: Verify Revision recorded in built tarball
        shell: bash
        run: |
          tarball=$(ls testpkg_*.tar.gz | head -1)
          rev=$(tar -xzf "$tarball" -O testpkg/DESCRIPTION | grep '^Revision:' | sed 's/^Revision:[[:space:]]*//')
          echo "Revision in tarball: '$rev'"
          if [ "$rev" != "${{ github.sha }}" ]; then
            echo "Expected Revision '${{ github.sha }}' but got '$rev'"
            exit 1
          fi

      - uses: ./litedown-site
        with:
          pkg-root: tests/pkg
          repo: true
          repo-fields: Revision

      - name: Verify site output
        shell: bash
        working-directory: tests/pkg/site
        run: |
          ls -R .
          for f in index.html .nojekyll src/contrib/PACKAGES; do
            [ -f "$f" ] || { echo "Missing $f"; exit 1; }
          done
          ls src/contrib/testpkg_*.tar.gz
          grep -q '^Package: testpkg' src/contrib/PACKAGES
          # default cleanup should have removed the .Rmd sources
          if ls *.Rmd >/dev/null 2>&1; then echo "Rmd files not cleaned"; exit 1; fi
