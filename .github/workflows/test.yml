name: Test actions

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: ./setup-r-dependencies
        with:
          working-directory: tests/pkg

      - uses: ./check-r-package
        with:
          working-directory: tests/pkg
