name: 'Build an R package site'
description: 'Build an R package site with litedown that includes the description, news, manuals, vignettes, and citation, etc.'
inputs:
  site-dir:
    description: 'Directory of the site source'
    default: 'site'
  pkg-root:
    description: 'Root directory of the R package in the repository'
    default: '.'
  exclude:
    description: 'Pages to be excluded (filenames separated by spaces)'
    default: 'code.Rmd'
  cleanup:
    description: 'Command to clean up the site directory before publishing, e.g., you can delete the `.Rmd` source files'
    default: 'rm -f *.Rmd *.yml _*'
  repo:
    description: 'Whether to also publish the package as a minimal R package repository under the site (builds the source tarball into `src/contrib` and generates the `PACKAGES` index, so users can install via `install.packages()` with the site URL as `repos`)'
    default: 'false'
  repo-fields:
    description: 'Additional DESCRIPTION fields to include in the `PACKAGES` index when `repo: true` (space- or comma-separated), passed to the `fields` argument of `tools::write_PACKAGES()`. For example, use `Revision` to surface a recorded git commit'
    default: ''
runs:
  using: "composite"
  steps:
    - name: Build site
      shell: bash
      run: |
        cd "${{ inputs.pkg-root }}"
        if [ ! -f DESCRIPTION ]; then
          for i in $(seq 2 10); do
            result=$(find . -mindepth $i -maxdepth $i -name DESCRIPTION | head -1)
            if [ -n "$result" ]; then
              cd "$(dirname "$result")"
              break
            fi
          done
        fi
        # Install the package if it is not already installed, since rendering
        # the site needs it (e.g. pkg_manual() reads the installed Rd database,
        # articles.Rmd lists the built vignettes, and pkg_citation() reads the
        # installed CITATION).
        pkg=$(Rscript -e "cat(read.dcf('DESCRIPTION', 'Package')[1, 1])")
        if ! Rscript -e "q(status = !requireNamespace('$pkg', quietly = TRUE))"; then
          R CMD build --no-manual .
          R CMD INSTALL "$pkg"_*.tar.gz
        fi
        mkdir -p "${{ inputs.site-dir }}"
        cd "${{ inputs.site-dir }}"
        # Copy template files into the site dir, keeping any files already there.
        ( cd "${{ github.action_path }}" && find . -type f -print ) | while IFS= read -r f; do
          if [ ! -e "$f" ]; then
            mkdir -p "$(dirname "$f")"
            cp "${{ github.action_path }}/$f" "$f"
          fi
        done
        [ -d "$OLDPWD/vignettes" ] || rm -f articles.Rmd
        [ -f "$OLDPWD/NEWS.md" ] || [ -f "$OLDPWD/inst/NEWS.Rd" ] || rm -f news.Rmd
        if [ -d "$OLDPWD/examples" ]; then
          cp -r "$OLDPWD/examples" ./
        else
          rm -f examples.Rmd
        fi
        [ -f "_footer.Rmd" ] && Rscript -e "litedown::fuse('_footer.Rmd', '.md')"
        rm -rf ${{ inputs.exclude }}
        if [ -f "$OLDPWD/docs/_litedown.yml" ] && [ ! -d "book" ]; then
          mkdir -p "book"
          touch "book/index.html"
        fi
        Rscript -e "litedown::fuse_site()"
        if [ -f "$OLDPWD/docs/_litedown.yml" ]; then
          Rscript -e "litedown::fuse_book('$OLDPWD/docs')"
          cp -r "$OLDPWD/docs"/* "book"/
          rm -f book/_litedown.yml book/*.Rmd
        fi
        [ -d "$OLDPWD/playground" ] && cp -r "$OLDPWD/playground/." playground
        if [ -d "examples" ]; then
          ls examples | grep -E '^[^_]' | grep -E '[.](Rmd|R)$' > playground/examples.txt
        fi
        touch .nojekyll
        if [ "${{ inputs.repo }}" = "true" ]; then
          mkdir -p src/contrib
          R CMD build "$OLDPWD"
          mv *.tar.gz src/contrib/
          Rscript -e "f = setdiff(strsplit('${{ inputs.repo-fields }}', '[[:space:],]+')[[1L]], '')" \
                  -e "tools::write_PACKAGES('src/contrib', fields = if (length(f)) f)"
        fi
        ${{ inputs.cleanup }}
